name: CI

# Roda em todo PR e em todo push na main. O push na main normalmente já vem de
# um merge de PR que passou, mas rodar de novo é o que garante que o badge do
# README reflete o estado real da main, e não o de uma branch.
on:
  pull_request:
  push:
    branches: [main]

# PR com vários pushes seguidos cancela a execução anterior — não adianta
# gastar minuto de runner testando um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  # Cancela execução superada de PR, NUNCA de push na main: um push na main
  # pode estar no meio do deploy da API, e cancelar ali deixaria o servidor
  # com dependência instalada pela metade.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend (testes e typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      # O cliente do Prisma é gerado, não commitado: sem isto o tsc não
      # conhece os tipos dos modelos e o typecheck vira decoração.
      - name: Gerar cliente do Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # Os 15 testes de regra de segurança. Rodam com um Prisma falso em
      # memória (testes/prismaFalso.ts), então não precisam de banco nem de
      # variável de ambiente além das que o próprio teste define.
      - name: Testes
        working-directory: backend
        run: npm test

      # A migration é escrita à mão neste projeto. Aplicá-la num SQLite
      # descartável é o que impede um SQL inválido de só aparecer no dia do
      # deploy, no servidor, com o banco de verdade na frente.
      - name: Aplicar migrations num banco descartável
        working-directory: backend
        env:
          DATABASE_URL: "file:./ci.db"
        run: npx prisma migrate deploy

  frontend:
    name: frontend (testes e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      # Sincronização offline: fila local, catálogo e estoque otimista, com
      # IndexedDB em memória (fake-indexeddb) — sem navegador.
      - name: Testes
        working-directory: frontend
        run: npm test

      # `npm run build` = tsc -b (typecheck) + vite build + gerar-headers.mjs.
      # VITE_API_URL precisa existir: é dela que sai o connect-src da CSP, e o
      # script falha de propósito se ela faltar. O valor aqui é só para o build
      # de verificação — o valor real vive nas variáveis do Cloudflare.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://casadocampo.duckdns.org
        run: npm run build

  # Publica a API no servidor. Só depois dos dois jobs acima passarem, e só em
  # push na main — ou seja, só depois de um PR mergeado.
  #
  # Isto existe porque o PWA se publica sozinho a cada merge (Cloudflare) e a
  # API não se publicava. A janela entre os dois deploys é o intervalo em que o
  # app novo conversa com a API antiga — que já derrubou o catálogo dos donos
  # uma vez, quando o app passou a chamar uma rota que o servidor ainda não
  # tinha.
  deploy-api:
    name: deploy da API
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Grupo próprio, sem cancelamento: deploy pela metade é pior que deploy
    # atrasado. Dois merges seguidos enfileiram, e o flock do script no
    # servidor é a segunda linha de defesa.
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      # Sem checkout: nada do repositório é usado aqui. Quem busca o código é
      # o próprio servidor, com `git fetch`.
      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # known_hosts vem de secret em vez de StrictHostKeyChecking=no: sem
          # isso o job aceitaria qualquer servidor que atendesse naquele
          # endereço, e entregaria a chave de deploy para ele.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ssh direto, sem action de terceiro: são três linhas, e uma action de
      # marketplace com acesso à chave de deploy é superfície que este projeto
      # não precisa ter.
      - name: Publicar
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              deploy

      - name: Conferir se a API pública respondeu
        run: |
          # O script já confere a saúde por dentro (127.0.0.1). Esta segunda
          # checagem é pela porta de fora: pega o caso em que a API subiu mas
          # o Caddy, o DNS ou o firewall ficaram no caminho.
          curl -fsS --retry 5 --retry-delay 3 --max-time 10 \
            "${{ secrets.DEPLOY_HEALTH_URL }}"
